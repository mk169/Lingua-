name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Nur ein Deployment gleichzeitig; laufende Builds werden nicht abgebrochen,
# damit ein bereits gestartetes Release sauber durchläuft.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Der Übungskatalog geht an alle Besucher – eine Übung mit falscher oder
      # fehlender Lösung würde mitgelernt. Kaputtes bricht hier ab, nicht live.
      - name: Übungen prüfen
        run: npm run validate:exercises

      # Der Sprint verspricht exakt 1350 Vokabeln, lückenlose Querverweise und
      # geplante Wiederholungen. Ein Verweis ins Leere schickt den Lernenden
      # mitten im Plan ins Nichts – das fällt hier auf, nicht beim Lernen.
      - name: Sprint prüfen
        run: npm run validate:sprint

      # Lernlogik: Auswertung, Niveau-Einordnung, Habit-Ableitung. Ein Fehler
      # darin bleibt still – ein falsch gerechneter Score sieht aus wie ein
      # Ergebnis, deshalb bricht er hier ab statt live zu gehen.
      - name: Tests
        run: npm test

      # Führt tsc -b und vite build aus – ein Typfehler bricht das Deployment ab.
      - name: Build
        run: npm run build

      # Die App war auf iOS Safari eine weiße Seite, während jede Prüfung in
      # Chromium grün war. Seitdem läuft der Start-Test über drei Engines.
      - name: Browser für den Smoke-Test
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Smoke-Test
        run: npm run smoke

      # Kein actions/configure-pages: Der Schritt dient nur dazu, die Basis-URL
      # automatisch zu ermitteln – die steht bei uns fest in vite.config.ts.
      # Er würde außerdem hart fehlschlagen, solange Pages nicht aktiviert ist,
      # und damit den ganzen Build blockieren.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Ein grüner Deploy heißt nicht, dass er auch live steht.
  #
  # Solange in den Repository-Einstellungen unter Pages ein Branch als Quelle
  # gewählt ist, läuft parallel GitHubs eigener Builder ("pages build and
  # deployment") und liefert das Repository roh aus – also die Quelldatei
  # index.html mit ihrem Verweis auf /src/main.tsx, den kein Browser ausführen
  # kann. Beide Workflows melden Erfolg, die Seite bleibt trotzdem weiß.
  # Genau das ist passiert und ist tagelang niemandem aufgefallen.
  #
  # Dieser Schritt sieht auf der echten Seite nach, statt es zu glauben.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ausgelieferte Seite prüfen
        run: |
          url="https://mk169.github.io/Lingua-/"
          for i in 1 2 3 4 5 6; do
            html=$(curl -fsSL --max-time 20 "$url" || true)
            case "$html" in
              *"/Lingua-/assets/index-"*) echo "✓ Gebaute App wird ausgeliefert."; exit 0 ;;
            esac
            echo "Versuch $i: noch nicht die gebaute App, warte 20s …"
            sleep 20
          done
          echo "::error::$url liefert nicht die gebaute App aus."
          case "$html" in
            *"/src/main.tsx"*)
              echo "::error::Es wird der Quelltext des Repositories ausgeliefert."
              echo "::error::Settings → Pages → Build and deployment → Source auf 'GitHub Actions' stellen."
              ;;
          esac
          printf '%s\n' "$html" | head -c 1500
          exit 1
