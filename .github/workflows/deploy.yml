name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/language-learning-app-llm-o1jaax
  workflow_dispatch:

# Nur ein Deployment gleichzeitig; laufende Builds werden nicht abgebrochen,
# damit ein bereits gestartetes Release sauber durchläuft.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Führt tsc -b und vite build aus – ein Typfehler bricht das Deployment ab.
      - name: Build
        run: npm run build

      # enablement schaltet GitHub Pages beim ersten Lauf selbst frei
      # (Source: GitHub Actions), sodass keine manuelle Einstellung nötig ist.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
